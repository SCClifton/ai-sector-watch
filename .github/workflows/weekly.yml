name: weekly-pipeline

on:
  schedule:
    # Sunday 18:00 UTC = Monday 04:00 / 05:00 in Sydney depending on DST.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Items per source"
        required: false
        default: "25"

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ANTHROPIC_BUDGET_USD_PER_RUN: "1"
      ANTHROPIC_MODEL: "claude-haiku-4-5-20251001"
      PIPELINE_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify setup
        run: python scripts/verify_setup.py --apply-schema

      # Cache key includes github.run_id so each run writes a fresh snapshot;
      # restore-keys fuzzy-match the most recent prior snapshot. The client's
      # internal cache key already includes the model, so a future model switch
      # cannot read stale outputs as if they came from the new model.
      - name: Restore Claude on-disk cache
        uses: actions/cache@v4
        with:
          path: data/local/claude_cache
          key: claude-cache-v1-${{ github.run_id }}
          restore-keys: |
            claude-cache-v1-

      - name: Run weekly pipeline
        run: |
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          python scripts/run_weekly_pipeline.py --limit "$LIMIT" | tee pipeline_summary.json

      # Folded in from the former research.yml. The research brief is rule-based
      # (no LLM calls) so it costs nothing extra. 168 hours covers the full
      # weekly window now that Tue/Fri runs are retired.
      - name: Run research brief
        run: |
          DATE="$(TZ=Australia/Sydney date +%F)"
          LIMIT="${{ github.event.inputs.limit || '25' }}"
          python scripts/run_research_brief.py \
            --date "$DATE" \
            --hours 168 \
            --limit "$LIMIT" \
            --timezone Australia/Sydney \
            --no-json \
            --write-db

      - name: Open digest PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain data/digests/)" ]; then
            DATE="$(date -u +%Y-%m-%d)"
            BRANCH="automation/weekly-digest-${DATE}-${GITHUB_RUN_ID}"
            git config user.name "ai-sector-watch-bot"
            git config user.email "ai-sector-watch-bot@users.noreply.github.com"
            git checkout -b "$BRANCH"
            git add data/digests/
            git commit -m "chore(digest): weekly run ${DATE}"
            git push -u origin "$BRANCH"
            gh pr create \
              --draft \
              --base main \
              --head "$BRANCH" \
              --title "chore(digest): weekly run ${DATE}" \
              --body "Generated by weekly pipeline run ${GITHUB_RUN_ID}."
          else
            echo "No digest changes to commit."
          fi

      - name: Upload pipeline summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-summary
          path: pipeline_summary.json
          retention-days: 30
